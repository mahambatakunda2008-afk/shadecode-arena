name: Arena API Worker CI

on:
  pull_request:
    paths:
      - "arena/backend/worker/**"
      - ".github/workflows/arena-api.yml"
  push:
    branches: ["main"]
    paths:
      - "arena/backend/worker/**"
      - ".github/workflows/arena-api.yml"

concurrency:
  group: arena-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: arena/backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arena/backend/worker/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
