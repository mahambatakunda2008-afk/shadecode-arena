name: Arena Native Client CI

on:
  push:
    branches: ["main"]
    paths:
      - "arena/apps/mobile/**"
      - "arena/tile-rush-engine/**"
      - ".github/workflows/arena-mobile.yml"
  pull_request:
    paths:
      - "arena/apps/mobile/**"
      - "arena/tile-rush-engine/**"
      - ".github/workflows/arena-mobile.yml"

concurrency:
  group: arena-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: arena/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - run: pnpm install --no-frozen-lockfile
      - run: node --experimental-strip-types --test src/circuit-breaker.test.mjs
      - run: pnpm exec expo install --check
      - run: pnpm dlx expo-doctor
      - run: pnpm exec expo export --platform android --output-dir dist-android
      - run: pnpm exec expo export --platform ios --output-dir dist-ios
      - run: pnpm run typecheck
